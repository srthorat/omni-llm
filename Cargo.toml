[package]
name = "omni-llm"
version = "0.1.0"
edition = "2021"
authors = ["Sakharam Thorat <sakharam.thorat@vonage.com>"]
description = "Ultra-Fast Native Rust LLM Inference Server with Iteration-Level Continuous Batching, Two-Tiered W-TinyLFU Prompt Caching, and Dual-Protocol Tool Calling (OpenAI + Gemini Live)"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
moka = { version = "0.12", features = ["future"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
async-trait = "0.1"
futures = "0.3"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
async-stream = "0.3"

[dev-dependencies]
tokio-test = "0.4"
